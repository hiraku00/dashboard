name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本番に入る依存だけを見る。high 以上の既知の脆弱性があれば、ここで止める。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test and build
        run: npm test

  # Mac 専用の collector のうち、純粋な Python の部分のテスト。macOS の画面操作・文字認識（pyobjc）が
  # 要るテストは、Vision が入っていない環境では自動で飛ばされる（collector/tests/ の importorskip）。
  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # pyobjc は macOS 専用で Linux には入らない。playwright はテストが使わない。
        run: |
          grep -h -v -e '^#' -e '^$' -e pyobjc -e playwright collector/requirements.txt collector/line_openchat/requirements.txt | sort -u > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"

      - name: Test
        working-directory: collector
        run: python -m pytest tests -q
